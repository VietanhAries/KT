<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== MÀU SẮC: sửa ở đây (sáng / tối) ===== */
:root{--bg:#eef0ea;--pn:#fbfbf6;--ink:#1d2a26;--mut:#5d6b65;--ln:#c9cfc4;--gold:#8a6a12;--gb:#e9dfba;--r0:#5d6b65;--r1:#1f7a5e;--r2:#2a63a8;--r3:#a06a00;--bad:#a3342a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--pn:#182622;--ink:#e6ebe4;--mut:#93a39b;--ln:#2d423b;--gold:#d8b45a;--gb:#3a3318;--r0:#9aa59f;--r1:#5fc2a2;--r2:#6fb0ee;--r3:#e8bd55;--bad:#e5786d}}
:root[data-theme="dark"]{--bg:#101a17;--pn:#182622;--ink:#e6ebe4;--mut:#93a39b;--ln:#2d423b;--gold:#d8b45a;--gb:#3a3318;--r0:#9aa59f;--r1:#5fc2a2;--r2:#6fb0ee;--r3:#e8bd55;--bad:#e5786d}
html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2{font-family:"Noto Serif",Georgia,serif;margin:0}
main{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
h1{font-size:26px}
#top b{color:var(--gold);font-size:17px}
section{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:10px}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--gold);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
button:hover:not(:disabled){background:var(--gb)}
button:disabled{opacity:.45;cursor:default;border-color:var(--ln)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ms{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.mh b{font-family:"Noto Serif",serif;font-size:16px;display:block}
.mh small{color:var(--mut);font-size:12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cell{border:1px solid var(--ln);border-radius:4px;padding:8px}
.cell small{color:var(--mut);display:block}
.cell b{font-family:"Noto Serif",serif;font-size:18px;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid section{margin:0}
.it{border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:4px;padding:8px;margin-bottom:8px}
.it b{color:var(--c)}
.r0{--c:var(--r0)}.r1{--c:var(--r1)}.r2{--c:var(--r2)}.r3{--c:var(--r3)}
.pill{font-style:normal;font-size:11px;border:1px solid var(--c);color:var(--c);border-radius:10px;padding:0 7px;margin-left:6px}
.st{display:block;color:var(--mut);font-size:13px;margin:2px 0 6px}
.bt{display:flex;gap:6px;flex-wrap:wrap}
.slot{color:var(--mut);font-size:12px;margin:6px 0 3px}
.empty{color:var(--mut);font-size:13px}
.dg{border:1px solid var(--ln);border-radius:4px;padding:10px;margin-bottom:8px}
.dg p{margin:2px 0 8px;color:var(--mut);font-size:13px}
#msg{min-height:22px;font-weight:500;margin-bottom:8px}
#log{margin:0;padding-left:18px;color:var(--mut);font-size:13px}
.ico{float:left;width:48px;height:48px;object-fit:contain;margin-right:8px;border-radius:4px}
.it::after{content:"";display:block;clear:both}
.hico{width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:8px;border-radius:4px}
#pick{display:none}.picking #pick{display:block}.picking>section,.picking>.grid{display:none}
.banner{width:100%;height:90px;object-fit:cover;border-radius:4px;margin-bottom:6px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.track{grid-template-columns:1fr}}
/* ===== NHẬT KÝ: nút nhỏ ở góc phải trên, bấm mở danh sách (không chiếm chỗ) ===== */
.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#sec-log{position:relative}
#sec-log summary{cursor:pointer;list-style:none;border:1px solid var(--gold);border-radius:4px;padding:3px 10px;font-size:13px}
#sec-log summary::-webkit-details-marker{display:none}
.logbox{position:absolute;right:0;top:calc(100% + 6px);width:min(440px,92vw);max-height:70vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px;z-index:20}
/* ===== BỐ CỤC GỌN 1 MÀN HÌNH (màn hình rộng từ 1001px). Màn nhỏ hơn vẫn cuộn như cũ ===== */
@media (min-width:1001px){
 body{overflow:hidden;font-size:13px;line-height:1.4}
 main{max-width:none;box-sizing:border-box;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:8px 10px;display:grid;gap:8px;
  grid-template-columns:1fr 1.15fr 1fr 1fr;grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"head head head head" "rep rep rep rep" "char act info bag"}   /* sắp xếp: 4 cột ở hàng dưới. Muốn đổi vị trí thì đổi tên trong dòng này */
 header{grid-area:head;margin:0}
 h1{font-size:20px}
 #sec-rep{grid-area:rep}#sec-char{grid-area:char}#sec-act{grid-area:act}#sec-info{grid-area:info}#sec-bag{grid-area:bag}
 .grid{display:contents}
 section{margin:0;padding:8px 10px;min-width:0;min-height:0;overflow:auto}
 h2{font-size:14px;margin-bottom:6px}
 #sec-rep h2{display:none}
 #pick{grid-column:1/-1;grid-row:2/4;overflow:auto}
 button{padding:3px 8px;font-size:12px}
 .track{gap:8px}
 .ms{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}
 .ms .mh{grid-column:1/-1}.ms .bar{margin:0}
 .mh b{font-size:14px}
 .info{grid-template-columns:1fr 1fr;gap:6px}
 .cell{padding:5px 7px}.cell b{font-size:15px}.cell small,.st{font-size:11px;margin:1px 0}
 .it{padding:5px 7px;margin-bottom:5px}
 .ico{width:36px;height:36px}.hico{width:32px;height:32px}
 .dg{padding:7px;margin-bottom:6px}.dg p{margin:2px 0 6px;font-size:12px}
 .banner{height:48px;margin-bottom:4px}
 #msg{min-height:18px;margin-bottom:4px;font-size:12px}
}
</style>
</head>
<body>
<main>
<header><h1>KT</h1><div class="hr"><div id="top"></div><details id="sec-log"><summary>Nhật ký</summary><div class="logbox"><ol id="log"></ol>
<p><button data-a="newday">Qua ngày mới (thử nghiệm)</button> <button data-a="exp">+10.000 EXP (thử nghiệm)</button> <button data-a="rep">+500 danh vọng mọi nhánh (thử nghiệm)</button> <button id="rs" data-a="reset">Chơi lại từ đầu</button></p></div></details></div></header>
<div id="pick"></div>
<section id="sec-rep"><h2>Danh vọng</h2><div class="track" id="track"></div></section>
<section id="sec-info"><h2>Thông tin nhân vật</h2><div class="info" id="info"></div></section>
<div class="grid">
<section id="sec-char"><h2>Nhân vật</h2><div id="char"></div></section>
<section id="sec-act"><h2>Hoạt động</h2><div id="msg"></div><div id="dg"></div></section>
<section id="sec-bag"><h2>Hành trang</h2><div id="bag"></div></section>
</div>
</main>
<script>
/* =====================================================================
   0. CẤU HÌNH CHUNG  (chỉnh các con số dùng chung cho cả game)
   ===================================================================== */
const KEY='hanh_lo_v6';              // tên bản lưu. Đổi cấu trúc dữ liệu thì đổi số này để tránh lỗi bản cũ
const IMG_DIR='img/';                 // thư mục ảnh trong repo (đổi đúng 1 chỗ này khi đổi tên thư mục)
const IMG_ALT='image/';              // thư mục dự phòng: ảnh không có ở IMG_DIR thì thử tiếp ở đây
const BAG=16;                        // sức chứa hành trang
const CAP=[1500,3000,4500];          // danh vọng đầy cấp 1 / 2 / 3 (dùng chung cho 3 nhánh)
const R=[                            // độ hiếm. m = hệ số nhân chỉ số gốc
 {n:'Thường',m:1},{n:'Tốt',m:1.8},{n:'Hiếm',m:3},{n:'Sử thi',m:5}];
const ODDS=[0,76,20,4];              // % rơi độ hiếm DV1 / DV2 / DV3 (tổng 100). DV0 chỉ là đồ khởi đầu

/* ---- CƯỜNG HÓA (tốn bạc, từ +6 trở lên có thể thất bại nhưng KHÔNG tụt cấp) ---- */
const UP_MAX=16;                     // cấp cường hóa tối đa
const UP_COST1=100;                  // bạc cường hóa ở cấp 1 (từ +0 lên +1)
const UP_COST_UP=0.6;                // mỗi cấp sau tăng 50% so với cấp trước (100, 150, 225, 338...)
const UP_SAFE=6;                     // cấp đích từ số này trở lên mới có thể thất bại
const UP_RATE={12:5}; // tỉ lệ thành công gốc (%) theo cấp đích. Sửa theo ý
const UP_LUCK=3.5;                    // mỗi lần thất bại +10% may mắn (cộng dồn). Thành công thì về 0%

/* ---- ĐIỂM DANH (mỗi ngày 1 lần, nút ở góc phải trên cùng). Quà ngẫu nhiên 1 trong 3 loại ---- */
const CI_SEAL=[10,50];               // quà điểm ấn: ngẫu nhiên 10 đến 50
const CI_SEAL_MAX=5;                 // quà ấn tối đa 5 lần mỗi tháng (hết lần thì chỉ rơi 2 loại còn lại)
const CI_STAT=[1,5];                 // quà chỉ số: +1 đến +5 vào 1 chỉ số ngẫu nhiên (cộng vĩnh viễn)
const CI_SIL_MAX=199;                // quà bạc: ngẫu nhiên dưới 200
const STAT_NAME={atk:'Sát thương',hp:'Máu',def:'Giáp',res:'Kháng'};

/* ---- EXP nhân vật ---- */
const EXP_PER_ACT=100;               // mỗi lần làm hoạt động +100 EXP
const EXP_L1=1000;                   // EXP cần để lên cấp 2
const EXP_UP=0.05;                   // mỗi cấp sau cần nhiều hơn cấp trước 5%
const LV_MAX=180;                    // cấp tối đa
const need=lv=>Math.round(EXP_L1*Math.pow(1+EXP_UP,lv-1)); // EXP cần ở cấp lv (tăng 5% so với cấp trước)
// Muốn tăng đều theo cấp 1000, 1050, 1100... thì thay công thức bằng: Math.round(EXP_L1*(1+EXP_UP*(lv-1)))

/* ---- NGỰA (tăng % chỉ số theo cấp nhân vật). Xếp từ cao xuống thấp ---- */
const HORSES=[ // img = ảnh ngựa (để '' nếu chưa có)
 {lv:150,n:'Ngựa xịn',p:30,pw:1500,img:'horse3.png'},   // p = % chỉ số, pw = LỰC CHIẾN cố định cộng thêm (bonus)
 {lv:100,n:'Ngựa tốt',p:20,pw:1000,img:'horse2.png'},
 {lv:60,n:'Ngựa thường',p:10,pw:500,img:'horse1.png'}];

/* ---- ẤN (mỗi hoạt động +điểm, đủ điểm thì lên sao, mỗi sao tăng % chỉ số VÀ cộng thêm lực chiến cố định) ---- */
const SEAL_ACT=100;                   // điểm ấn mỗi hoạt động
const SEAL_STEP=1000;                // điểm cho 1 sao
const SEAL_MAX=10;                   // số sao tối đa
const SEAL_IMGS={0:'seal0.png',10:'seal10.png'}; // số sao : ảnh ấn. Muốn thêm mốc thì thêm dạng 5:'seal5.png'
// chọn ảnh theo số sao hiện tại: lấy ảnh của mốc cao nhất mà số sao đã đạt (1 đến 9 sao dùng ảnh 0 sao)
const sealImg=()=>{let src='';Object.keys(SEAL_IMGS).map(Number).sort((a,b)=>a-b).forEach(k=>{if(stars()>=k)src=SEAL_IMGS[k]});return src};
const SEAL_PCT=5;                    // mỗi sao +5% chỉ số
const SEAL_PW_STAR=100;              // mỗi sao còn +100 lực chiến cố định (bonus, đủ 10 sao = 1000)

/* ---- PHI PHONG (chưa có, bổ sung sau). Trả về % chỉ số cộng thêm ---- */
const CLOAK_IMG='cloak.png';     // ảnh phi phong (để '' nếu chưa có)
const CLOAK_STEP=1000;   // mỗi 1000 lực chiến lên 1 bậc
const CLOAKS=[
 {n:'Siêu Phàm',p:2,img:'cloak1.png'}, //  n = tên hiển thị   p = % chỉ số cộng thêm   img = tên file ảnh
 {n:'Xuất Trần',p:4,img:'cloak2.png'},
 {n:'Lăng Tuyệt',p:6,img:'cloak3.png'},
 {n:'Kinh Thế',p:8,img:'cloak4.png'},
 {n:'Ngự Không',p:10,img:'cloak5.png'},
 {n:'Hỗn Thiên',p:12,img:'cloak6.png'},
 {n:'Sồ Phượng',p:14,img:'cloak7.png'},
 {n:'Tiềm Long',p:16,img:'cloak8.png'},
 {n:'Chí Tôn',p:18,img:'cloak9.png'},
 {n:'Vô Song',p:20,img:'cloak10.png'},
 ];

/* =====================================================================
   1. VŨ KHÍ  (cộng SÁT THƯƠNG)  -  hoạt động: Đánh hải tặc
   Muốn chỉnh vũ khí: sửa trong khối WEAPON ngay dưới đây
   ===================================================================== */
const WEAPON={
 label:'Vũ khí',
 imgs:['weapon0.png','weapon1.png','weapon2.png','weapon3.png'], // ảnh theo độ hiếm (Thường, Tốt, Hiếm, Sử thi), cùng thứ tự với names
 names:['Thiết Kiếm','Thanh Phong Kiếm','Huyền Thiết Kiếm','Thanh Long Kiếm'], // tên theo độ hiếm: Thường, Tốt, Hiếm, Sử thi
 roll:m=>({atk:Math.round(rnd(5,10)*m)}),   // chỉ số gốc: sát thương 5 đến 9, nhân hệ số độ hiếm m
 act:
 {
	n:'Đánh hải tặc',d:'Truy nã hải tặc.',img:'haitac.png', // img = ảnh khung hoạt động (để '' nếu chưa có)
	
	req:30,     // lực chiến khuyến nghị (càng thấp hơn thì tỉ lệ thắng càng thấp)
	sil:20,     // bạc thưởng khi thắng
	drop:.3,    // tỉ lệ rơi vũ khí khi thắng (0.3 = 30%)
	max:10,		// số lượt mỗi đợt reset
	reset:[0]		// giờ reset lượt (0 = 0h đêm). Hải tặc chỉ reset 0h
  },   
 gain:[15,30,45],// danh vọng vũ khí mỗi lượt, theo cấp 1 / 2 / 3
 chests:[{sil:500,r:1},{sil:1000,r:2},{sil:2000,r:3}] // quà khi đầy cấp 1 / 2 / 3 (bạc, độ hiếm vũ khí)
};

/* =====================================================================
   1B. MÔN PHÁI  (chọn 1 lần trước khi chơi, mỗi phái có VŨ KHÍ đặc thù riêng)
   Thêm phái: copy nguyên 1 khối (vd thieuLam:{...}) rồi đổi tên khóa và nội dung.
   Các phái dưới đây chỉ là ví dụ, bạn đổi tên / mô tả / vũ khí / chỉ số theo ý.
   ===================================================================== */
const PHAI={
 thieuLam:{n:'Thiếu Lâm',d:'Võ công cương mãnh, dùng côn.',
  names:['Thiết Côn','Hổ Vĩ Côn','Kim Cang Côn','Long Hổ Côn'],            // tên vũ khí theo độ hiếm: Thường, Tốt, Hiếm, Sử thi
  imgs:['thieulam0.png','thieulam1.png','thieulam2.png','thieulam3.png'],   // ảnh vũ khí (nằm trong thư mục ảnh, cùng thứ tự với names)
  roll:m=>({atk:Math.round(rnd(5,9)*m)})},                                  // chỉ số gốc vũ khí của phái này (bỏ dòng roll thì dùng của khối WEAPON)
 voDang:{n:'Võ Đang',d:'Kiếm pháp nhẹ nhàng, dùng kiếm.',
  names:['Thanh Cương Kiếm','Tử Điện Kiếm','Thái Cực Kiếm','Chân Vũ Kiếm'],
  imgs:['vodang0.png','vodang1.png','vodang2.png','vodang3.png'],
  roll:m=>({atk:Math.round(rnd(4,10)*m)})},                                 // ví dụ: sát thương dao động rộng hơn
 caiBang:{n:'Cái Bang',d:'Bổng pháp hiểm hóc, dùng bổng.',
  names:['Trúc Bổng','Bổng Phá Thiên','Long Đầu Bổng','Đả Cẩu Bổng'],
  imgs:['caibang0.png','caibang1.png','caibang2.png','caibang3.png'],
  roll:m=>({atk:Math.round(rnd(6,8)*m)})},
 minhGiao:{n:'Minh Giáo',d:'tôn giáo cổ gốc Ba Tư, sử dụng kiếm',
  names:['Trường Kiếm','Linh Dương Kiếm','Huyền Ma Kiếm','Liệt Diệm Ma Kiếm'],
  imgs:['minhgiao0.png','minhgiao1.png','minhgiao2.png','minhgiao3.png'],
  roll:m=>({atk:Math.round(rnd(5,8)*m)})}  // ví dụ: sát thương ổn định hơn
};

/* =====================================================================
   2. TRANG SỨC  (cộng GIÁP và KHÁNG)  -  hoạt động: Phó bản TĐLT
   Muốn chỉnh trang sức: sửa trong khối CHARM ngay dưới đây
   ===================================================================== */
const CHARM={
 label:'Trang sức',
 imgs:['charm0.png','charm1.png','charm2.png','charm3.png'],
 names:['Ngọc Bội Đá','Ngọc Bích','Hổ Phách Bội','Long Ngọc Bội'],
 roll:m=>({def:Math.round(rnd(3,6)*m),res:Math.round(rnd(3,6)*m)}), // giáp 3 đến 6, kháng 3 đến 6, nhân hệ số độ hiếm m
 act:
 {
	n:'Phó bản TĐLT',d:'Phó bản rơi trang sức.',img:'tdlt.png',req:220,sil:200,drop:.45,max:2,
	reset:[0,12],  // giờ reset lượt: 0h đêm và 12h trưa, lượt cũ không cộng dồn
	days:[2,4,6] // chỉ mở thứ 3 và thứ 5 (0=Chủ nhật, 1=Thứ 2, 2=Thứ 3, 3=Thứ 4, 4=Thứ 5, 5=Thứ 6, 6=Thứ 7)
 },   
 gain:[50,100,150],
 chests:[{sil:500,r:1},{sil:1000,r:2},{sil:2000,r:3}]
};

/* =====================================================================
   3. PHÒNG CỤ  (cộng MÁU)  -  hoạt động: Phó bản TDC
   Muốn chỉnh phòng cụ: sửa trong khối ARMOR ngay dưới đây
   ===================================================================== */
const ARMOR={
 label:'Phòng cụ',
 imgs:['armor0.png','armor1.png','armor2.png','armor3.png'],
 names:['Áo Vải Thô','Giáp Da Thú','Thiết Giáp','Kim Ti Giáp'],
 roll:m=>({hp:Math.round(rnd(40,70)*m)}),   // máu gốc 40 đến 70, nhân hệ số độ hiếm m
 act:{n:'Phó bản TDC',d:'Phó bản rơi phòng cụ.',img:'tdc.png',
  req:90,sil:1000,drop:.4,max:2,reset:[0,12]},
 gain:[15,20,35],
 chests:[{sil:500,r:1},{sil:1000,r:2},{sil:2000,r:3}]
};

/* ---- Gom 3 loại lại. Thứ tự ở đây là thứ tự hiển thị trên màn hình ---- */
const SLOTS={weapon:WEAPON,armor:ARMOR,charm:CHARM};
const SK=Object.keys(SLOTS);
const SL={};SK.forEach(k=>SL[k]=SLOTS[k].label);          // nhãn: SL.weapon = 'Vũ khí'...
const DG=SK.map(k=>Object.assign({slot:k},SLOTS[k].act)); // danh sách hoạt động, lấy từ 3 khối trên
const Z=()=>DG.map(()=>0);                                 // bộ đếm lượt trong ngày

/* =====================================================================
   4. LOGIC GAME  (thường không cần sửa)
   ===================================================================== */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let S,armed=false;

// tạo 1 món đồ: lấy tên và chỉ số gốc từ khối của loại đó (WEAPON / CHARM / ARMOR)
// vũ khí lấy tên, ảnh, chỉ số theo PHÁI đã chọn. Phòng cụ và trang sức lấy từ khối của chúng
const hasP=slot=>slot==='weapon'&&S.phai&&PHAI[S.phai];
const namesOf=slot=>hasP(slot)?PHAI[S.phai].names:SLOTS[slot].names;
const imgsOf=slot=>(hasP(slot)&&PHAI[S.phai].imgs)||SLOTS[slot].imgs||[];
const rollOf=slot=>(hasP(slot)&&PHAI[S.phai].roll)||SLOTS[slot].roll;
function mk(slot,r){const it={id:S.n++,slot,r,lv:0,name:namesOf(slot)[r],atk:0,def:0,res:0,hp:0};
 return Object.assign(it,rollOf(slot)(R[r].m))}
function roll(){let x=Math.random()*100;for(let r=1;r<4;r++){if(x<ODDS[r])return r;x-=ODDS[r]}return 1}

const newState=()=>({sil:50,rep:Object.fromEntries(SK.map(k=>[k,0])),lv:1,exp:0,seal:0,ent:Z(),n:1,eq:{},bag:[],cl:[],log:[],luck:0,bonus:{atk:0,hp:0,def:0,res:0},ci:{last:'',streak:0,mon:'',seal:0}}); // trạng thái mặc định
function fresh(){S=newState();
 S.eq.weapon=null;S.eq.armor=mk('armor',0);S.eq.charm=null} // vũ khí khởi đầu được cấp khi chọn phái // đồ khởi đầu: vũ khí và phòng cụ thường
// bổ sung các trường còn thiếu cho bản lưu cũ. Nhờ vậy thêm tính năng mới KHÔNG cần đổi KEY, tiến trình cũ giữ nguyên
function migrate(){const b=newState();for(const k in b)if(S[k]===undefined)S[k]=b[k];
 SK.forEach(k=>{if(S.rep[k]===undefined)S.rep[k]=0})}
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);migrate();return}}catch(e){}fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ---- ngày mới: làm mới lượt ----
// mã đợt hiện tại của 1 hoạt động, tính theo mảng reset của nó. Mã đổi nghĩa là vừa qua mốc reset
const period=(d,t=new Date())=>{const h=t.getHours();let s=-1;
 (d.reset||[0]).forEach((x,k)=>{if(h>=x)s=k});
 return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()+'-'+s};
// qua mốc reset thì lượt của hoạt động đó về 0 (không cộng dồn). Trả về true nếu có thay đổi
function tick(){let ch=false;
 if(!S.per){  // bản lưu cũ chưa có mốc đợt: coi lượt đang giữ thuộc về 0h của ngày S.day (ngày lưu cũ), nên qua 12h sẽ được làm mới đúng. Bản lưu mới đã có S.per nên deploy code không bị reset
  const m=/^(\d+)-(\d+)-(\d+)$/.exec(S.day||''),t0=m?new Date(+m[1],+m[2]-1,+m[3],0,0):new Date();
  S.per=DG.map(d=>period(d,t0))}
 DG.forEach((d,i)=>{const c=period(d);
  if(S.per[i]!==c){S.per[i]=c;S.ent[i]=0;ch=true}                   // qua mốc: đặt lượt về 0
  if(!(S.ent[i]>=0))S.ent[i]=0;                                      // sửa bản lưu hỏng
  if(S.ent[i]>d.max){S.ent[i]=d.max;ch=true}});                      // kéo về max nếu bạn vừa giảm max
 return ch}

// ---- danh vọng: cấp theo từng nhánh, và điểm cộng mỗi lượt lấy từ mảng gain của khối tương ứng ----
const lvl=k=>S.rep[k]>=CAP[1]?3:S.rep[k]>=CAP[0]?2:1;
const gain=k=>S.rep[k]>=CAP[2]?0:SLOTS[k].gain[lvl(k)-1];

// ---- EXP nhân vật ----
function addExp(n){if(S.lv>=LV_MAX)return;S.exp+=n;
 while(S.lv<LV_MAX&&S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++}
 if(S.lv>=LV_MAX)S.exp=0}

// ---- chỉ số và lực chiến ----
const f=i=>1+.1*i.lv,v=(x,i)=>Math.round(x*f(i));            // mỗi cấp cường hóa +10%
const pw=i=>Math.round((i.atk*2+i.def*2+(i.res||0)*2+i.hp/4)*f(i)); // lực chiến của 1 món
const horse=()=>HORSES.find(h=>S.lv>=h.lv)||null;
const stars=()=>Math.floor(S.seal/SEAL_STEP);
const pctBase=()=>{const h=horse();return (h?h.p:0)+stars()*SEAL_PCT}; // % chỉ số từ ngựa + ấn (chưa có phi phong)
const horsePw=()=>{const h=horse();return h?h.pw:0};  // lực chiến BONUS cố định từ ngựa (500 / 1000 / 1500), ngoài % chỉ số
const sealPw=()=>stars()*SEAL_PW_STAR;                // lực chiến BONUS cố định từ ấn (mỗi sao +100, 10 sao = 1000), ngoài % chỉ số
const flatPower=()=>horsePw()+sealPw();               // tổng lực chiến cố định, cộng thẳng vào lực chiến
const pct=()=>pctBase()+cloak();                                       // tổng % chỉ số: ngựa + ấn + phi phong
const statX=(k,c)=>Math.round((Object.values(S.eq).reduce((a,i)=>a+(i?v(i[k]||0,i):0),0)+(S.bonus&&S.bonus[k]||0))*(1+(c?pct():pctBase())/100)); // (đồ + chỉ số điểm danh) x (1 + %). c=true thì tính cả phi phong
const stat=k=>statX(k,true);
const powerOf=c=>Math.round(statX('atk',c)*2+statX('def',c)*2+statX('res',c)*2+statX('hp',c)/4)+flatPower(); // lực chiến = từ chỉ số + lực chiến cố định của ngựa và ấn
const power=()=>powerOf(true);       // lực chiến tổng (đã có phi phong)
const rawPower=()=>powerOf(false);   // lực chiến CHƯA tính phi phong, dùng để mở phi phong (tránh vòng lặp)
const cloakTier=()=>Math.min(CLOAKS.length,Math.floor(rawPower()/CLOAK_STEP)); // 0 = chưa mở
const cloakNow=()=>{const t=cloakTier();return t?CLOAKS[t-1]:null};
const cloak=()=>{const c=cloakNow();return c?c.p:0};                              // % chỉ số từ phi phong
// chèn ảnh: nếu chưa có file ảnh thì tự ẩn, không hiện icon hỏng
const img=(f,cls)=>f?`<img class="${cls}" src="${IMG_DIR}${f}" alt="" onerror="if(!this.dataset.r){this.dataset.r=1;this.src='${IMG_ALT}${f}'}else{this.style.display='none'}">`:'';
const cell=(t,b,s)=>`<div class="cell"><small>${t}</small><b>${b}</b><div class="st">${s}</div></div>`;

// ---- cường hóa / bán ----
const cost=i=>Math.round(UP_COST1*Math.pow(1+UP_COST_UP,i.lv)),price=i=>15*(i.r+1)**2+i.lv*10;
const upRate=tg=>Math.min(100,(UP_RATE[tg]||50)+S.luck); // tỉ lệ thành công = gốc + may mắn
const find=id=>{for(const k in S.eq)if(S.eq[k]&&S.eq[k].id==id)return S.eq[k];return S.bag.find(i=>i.id==id)};

function say(t,bad){S.log.unshift(t);S.log=S.log.slice(0,8);$('msg').textContent=t;$('msg').style.color=bad?'var(--bad)':'var(--ink)'}

// ---- đi 1 hoạt động ----
const DAY_NAME=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const isOpen=d=>!d.days||d.days.includes(new Date().getDay());     // hôm nay hoạt động này có mở không
const openText=d=>d.days.map(x=>DAY_NAME[x]).join(', ');            // ví dụ "Thứ 3, Thứ 5"	
function run(i){tick();const d=DG[i],k=d.slot,lbl=SL[k].toLowerCase();
 if(!isOpen(d)){say(`${d.n} chỉ mở vào: ${openText(d)}.`,1);return}				
 if(S.ent[i]>=d.max){say('Bạn đã hết lượt: '+d.n+'.',1);return}
 S.ent[i]++;
 S.seal=Math.min(SEAL_STEP*SEAL_MAX,S.seal+SEAL_ACT);       // ấn +điểm
 const p=Math.min(.97,Math.max(.1,power()/d.req*.8)),lv0=S.lv;
 addExp(EXP_PER_ACT);                                         // EXP +100
 const g=gain(k);S.rep[k]=Math.min(CAP[2],S.rep[k]+g);        // danh vọng của nhánh này
 const win=Math.random()<p;let t;
 if(win){S.sil+=d.sil;t=`Thắng ${d.n}: +${g} danh vọng ${lbl}, +${d.sil} bạc, +${EXP_PER_ACT} EXP.`;
  if(Math.random()<d.drop){const it=mk(k,roll());
   if(S.bag.length<BAG){S.bag.push(it);t+=` Nhặt được ${it.name} (${R[it.r].n}).`}else{S.sil+=price(it);t+=' Hành trang đầy, đồ rơi được bán tự động.'}}}
 else{const s=Math.round(d.sil*.3);S.sil+=s;t=`Thất bại ở ${d.n}: vẫn +${g} danh vọng ${lbl}, chỉ +${s} bạc, +${EXP_PER_ACT} EXP, không rơi đồ.`}
 if(S.lv>lv0)t+=` Lên cấp ${S.lv}!`;
 say(t,!win)}

/* ---- ĐIỂM DANH ---- */
const dayKey=(t=new Date())=>t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();
const monKey=()=>{const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)};
const streakNow=()=>{const y=new Date();y.setDate(y.getDate()-1);return(S.ci.last===dayKey()||S.ci.last===dayKey(y))?S.ci.streak:0};
function checkin(){const c=S.ci,dk=dayKey();
 if(c.last===dk){say('Hôm nay bạn đã điểm danh rồi.',1);return}
 c.streak=streakNow()+1;c.last=dk;                               // hôm qua có điểm danh thì chuỗi +1, bỏ lỡ 1 ngày thì tính lại từ 1
 if(c.mon!==monKey()){c.mon=monKey();c.seal=0}                   // sang tháng mới: làm mới số lần nhận quà ấn
 const pool=['sil','stat'];if(c.seal<CI_SEAL_MAX)pool.push('seal');
 const g=pool[rnd(0,pool.length-1)];let t;
 if(g==='seal'){const n=rnd(CI_SEAL[0],CI_SEAL[1]);S.seal=Math.min(SEAL_STEP*SEAL_MAX,S.seal+n);c.seal++;t=`+${n} điểm ấn (còn ${CI_SEAL_MAX-c.seal} lần quà ấn trong tháng)`}
 else if(g==='stat'){const k=Object.keys(STAT_NAME)[rnd(0,3)],n=rnd(CI_STAT[0],CI_STAT[1]);S.bonus[k]=(S.bonus[k]||0)+n;t=`+${n} ${STAT_NAME[k]} vĩnh viễn`}
 else{const n=rnd(1,CI_SIL_MAX);S.sil+=n;t=`+${n} bạc`}
 say(`Điểm danh ngày thứ ${c.streak} liên tiếp: ${t}.`)}

/* =====================================================================
   5. HIỂN THỊ
   ===================================================================== */
function stats(i){return [i.atk?'Sát thương '+v(i.atk,i):'',i.hp?'Máu '+v(i.hp,i):'',i.def?'Giáp '+v(i.def,i):'',i.res?'Kháng '+v(i.res,i):''].filter(Boolean).join(', ')+' (lực chiến '+pw(i)+')'}
function card(i,eq){return `<div class="it r${i.r}">${img(imgsOf(i.slot)[i.r],'ico')}<b>${i.name}${i.lv?' +'+i.lv:''}</b><i class="pill">${R[i.r].n}</i><span class="st">${eq?'':SL[i.slot]+': '}${stats(i)}</span><div class="bt">${eq?'':`<button data-a="eq" data-id="${i.id}">Mặc</button>`}<button data-a="up" data-id="${i.id}" ${i.lv>=UP_MAX||S.sil<cost(i)?'disabled':''}>${i.lv>=UP_MAX?'Tối đa':'Cường hóa '+cost(i)+' bạc'+(i.lv+1>=UP_SAFE?' ('+upRate(i.lv+1)+'%)':'')}</button>${eq?'':`<button data-a="sell" data-id="${i.id}">Bán +${price(i)}</button>`}</div></div>`}

// ô danh vọng của 1 nhánh: CHỈ hiện cấp hiện tại (mốc chưa nhận quà đầu tiên). Nhận quà xong mới sang cấp kế
function trackCell(k){const lbl=SL[k].toLowerCase(),ch=SLOTS[k].chests;let x=0;
 while(x<CAP.length&&S.cl.includes(k+CAP[x]))x++;
 if(x>=CAP.length)return `<div class="ms"><div class="mh"><b>${SL[k]} tối đa</b><small>${S.rep[k]}/${CAP[2]}. Đã nhận hết quà.</small></div><div class="bar"><i style="width:100%"></i></div></div>`;
 const lo=x?CAP[x-1]:0,tg=CAP[x],m=ch[x],pc=Math.max(0,Math.min(1,(S.rep[k]-lo)/(tg-lo)))*100,can=S.rep[k]>=tg;
 return `<div class="ms"><div class="mh"><b>${SL[k]} cấp ${x+1}</b><small>${S.rep[k]}/${tg}. Quà: ${m.sil} bạc và ${lbl} ${R[m.r].n}</small></div><div class="bar"><i style="width:${pc}%"></i></div><button data-a="chest" data-k="${k}" data-x="${x}" ${can?'':'disabled'}>${can?'Mở quà':'Chưa đủ danh vọng'}</button></div>`}

// màn chọn phái (hiện khi chưa chọn phái)
function renderPick(){$('pick').innerHTML='<section><h2>Chọn môn phái</h2><p class="empty">Mỗi phái có vũ khí đặc thù riêng. Chọn trước khi chơi, muốn đổi phải chơi lại từ đầu.</p><div class="track">'+
 Object.keys(PHAI).map(k=>{const p=PHAI[k];return `<div class="dg">${img(p.imgs&&p.imgs[0],'hico')}<b>${p.n}</b><p>${p.d} Vũ khí: ${p.names.join(', ')}.</p><button data-a="phai" data-k="${k}">Chọn phái này</button></div>`}).join('')+'</div></section>'}
function render(){tick();
 const picked=S.phai&&PHAI[S.phai];document.querySelector('main').classList.toggle('picking',!picked);
 if(!picked){renderPick();return}
 const cd=S.ci.last===dayKey();
 $('top').innerHTML=`<span>Phái <b>${PHAI[S.phai].n}</b></span><span style="margin-left:16px">Bạc <b>${S.sil}</b></span> <button style="margin-left:16px" data-a="checkin" ${cd?'disabled':''}>${cd?'Đã điểm danh, chuỗi '+S.ci.streak+' ngày':'Điểm danh'}</button>`;
 $('track').innerHTML=SK.map(trackCell).join('');
 const h=horse(),st=stars(),nh=HORSES.slice().reverse().find(x=>x.lv>S.lv),cl=cloakNow(),ct=cloakTier();
 const expPc=S.lv>=LV_MAX?100:S.exp/need(S.lv)*100;
 $('info').innerHTML=
  cell('Cấp nhân vật','Cấp '+S.lv,`<div class="bar"><i style="width:${expPc}%"></i></div>`+(S.lv>=LV_MAX?'Cấp tối đa':`EXP ${S.exp}/${need(S.lv)}. Mỗi hoạt động +${EXP_PER_ACT} EXP`))+
  cell('Lực chiến',power(),`Từ đồ ${power()-flatPower()}, bonus ngựa +${horsePw()}, ấn +${sealPw()}. Chỉ số +${(h?h.p:0)+st*SEAL_PCT+cloak()}% (ngựa ${h?h.p:0}%, ấn ${st*SEAL_PCT}%, phi phong ${cloak()}%)`)+
  cell('Chỉ số','Sát thương '+stat('atk'),`Máu ${stat('hp')}, Giáp ${stat('def')}, Kháng ${stat('res')}`)+
  cell('Ngựa',(h?img(h.img,'hico'):'')+(h?h.n:'Chưa có'),(h?`+${h.p}% chỉ số, +${h.pw} lực chiến. `:'Chưa có ngựa. ')+(nh?`Còn ${nh.lv-S.lv} cấp tới ${nh.n} (cấp ${nh.lv}: +${nh.p}% chỉ số, +${nh.pw} lực chiến).`:'Đã ở bậc cao nhất.'))+
  cell('Ấn',img(sealImg(),'hico')+`${st}/${SEAL_MAX} sao`,st>=SEAL_MAX?`Đã tối đa, +${st*SEAL_PCT}% chỉ số, +${sealPw()} lực chiến`:`${S.seal%SEAL_STEP}/${SEAL_STEP} điểm tới sao kế. Mỗi sao +${SEAL_PCT}% chỉ số và +${SEAL_PW_STAR} lực chiến (đang +${st*SEAL_PCT}%, +${sealPw()}). Mỗi hoạt động +${SEAL_ACT} điểm`)+
  cell('Điểm danh','Chuỗi '+streakNow()+' ngày',`Chỉ số cộng thêm: ${Object.keys(STAT_NAME).map(k=>STAT_NAME[k]+' +'+(S.bonus[k]||0)).join(', ')}. Quà ấn tháng này: ${S.ci.mon===monKey()?S.ci.seal:0}/${CI_SEAL_MAX}`)+
  cell('May mắn cường hóa','+'+S.luck+'%',`Mỗi lần thất bại +${UP_LUCK}%, cường hóa thành công thì về 0%`)+
  cell('Lượt hôm nay','',DG.map((d,i)=>`${d.n}: còn ${Math.max(0,d.max-S.ent[i])}/${d.max} lượt`).join('<br>'))+
  cell('Phi phong',cl?img(cl.img,'hico')+cl.n:img(CLOAK_IMG,'hico')+'Chưa mở',cl?`+${cl.p}% chỉ số. Bậc ${ct}/${CLOAKS.length}. `+(ct<CLOAKS.length?`Đạt lực chiến ${(ct+1)*CLOAK_STEP} để lên ${CLOAKS[ct].n}.`:'Đã ở bậc cao nhất.'):`Cần lực chiến ${CLOAK_STEP} (hiện ${rawPower()}).`);
 $('char').innerHTML=`<p>Lực chiến <b style="color:var(--gold);font-size:20px">${power()}</b></p>`+
  SK.map(k=>`<div class="slot">${SL[k]}</div>`+(S.eq[k]?card(S.eq[k],1):'<div class="empty">Chưa trang bị</div>')).join('');
 $('dg').innerHTML=DG.map((d,i)=>{const p=Math.round(Math.min(.97,Math.max(.1,power()/d.req*.8))*100);
  return `<div class="dg">${img(d.img,'banner')}<b>${d.n}</b><p>${d.d} Khuyến nghị lực chiến ${d.req}. Tỉ lệ thắng ${p}%. Thưởng ${gain(d.slot)} danh vọng ${SL[d.slot].toLowerCase()}, ${d.sil} bạc, ${EXP_PER_ACT} EXP, có thể rơi ${SL[d.slot].toLowerCase()}. Còn ${Math.max(0,d.max-S.ent[i])}/${d.max} lượt đợt này.${d.days?`<br>Mở vào: ${openText(d)}${isOpen(d)?'':' (hôm nay chưa mở)'}`:''}</p><button data-a="run" data-i="${i}" ${S.ent[i]>=d.max||!isOpen(d)?'disabled':''}>Đi ngay</button></div>`}).join('');
 $('bag').innerHTML=`<p class="empty">${S.bag.length}/${BAG} món</p>`+(S.bag.length?S.bag.map(i=>card(i,0)).join(''):'<div class="empty">Trống. Đi làm hoạt động để tìm trang bị.</div>');
 $('log').innerHTML=S.log.map(t=>`<li>${t}</li>`).join('')||'<li>Chưa có gì xảy ra.</li>';
 $('rs').textContent='Chơi lại từ đầu';armed=false;save()}

/* =====================================================================
   6. NÚT BẤM
   ===================================================================== */
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='reset'){if(!armed){armed=true;b.textContent='Bấm lại để xóa toàn bộ tiến trình';return}fresh();render();say('Bắt đầu hành trình mới.');return}
 if(a==='phai'){if(PHAI[b.dataset.k]){S.phai=b.dataset.k;if(!S.eq.weapon)S.eq.weapon=mk('weapon',0);say('Bạn đã chọn phái '+PHAI[S.phai].n+'.')}}
 else if(a==='newday'){S.ent=Z();say('Sang ngày mới: lượt hoạt động đã làm mới.')}
 else if(a==='exp'){const l0=S.lv;addExp(10000);say('Thử nghiệm: +10000 EXP.'+(S.lv>l0?` Lên cấp ${S.lv}.`:''))}
 else if(a==='rep'){SK.forEach(k=>S.rep[k]=Math.min(CAP[2],S.rep[k]+500));say('Thử nghiệm: +500 danh vọng cho mọi nhánh.')}
 else if(a==='run')run(+b.dataset.i);
 else if(a==='eq'){const k=S.bag.findIndex(i=>i.id==id);if(k<0)return;const it=S.bag.splice(k,1)[0],old=S.eq[it.slot];if(old)S.bag.push(old);S.eq[it.slot]=it}
 else if(a==='up'){const it=find(id);if(it&&it.lv<UP_MAX&&S.sil>=cost(it)){S.sil-=cost(it);const tg=it.lv+1;
  if(tg<UP_SAFE){it.lv=tg;say(`Cường hóa ${it.name} lên +${tg}.`)}        // cấp thấp: luôn thành công
  else{const rate=upRate(tg);
   if(Math.random()*100<rate){it.lv=tg;S.luck=0;say(`Cường hóa thành công ${it.name} lên +${tg}! May mắn về 0%.`)}
   else{S.luck+=UP_LUCK;say(`Cường hóa thất bại (tỉ lệ ${rate}%), mất bạc nhưng không tụt cấp. May mắn +${UP_LUCK}%, hiện ${S.luck}%.`,1)}}}}
 else if(a==='checkin')checkin();
 else if(a==='sell'){const k=S.bag.findIndex(i=>i.id==id);if(k>=0){S.sil+=price(S.bag[k]);S.bag.splice(k,1)}}
 else if(a==='chest'){const k=b.dataset.k,x=+b.dataset.x,m=SLOTS[k].chests[x],cid=k+CAP[x];
  if(m&&S.rep[k]>=CAP[x]&&!S.cl.includes(cid)){S.cl.push(cid);S.sil+=m.sil;const it=mk(k,m.r);S.bag.push(it);
   say(`Mở quà ${SL[k].toLowerCase()} cấp ${x+1}: +${m.sil} bạc và ${it.name} (${R[it.r].n}).`)}}
 const keep=$('msg').textContent;render();$('msg').textContent=keep});
 
 /* =====================================================================
   7. TỰ LUYỆN (tăng EXP theo thời gian)
   ===================================================================== */
const TRAIN_SEC=10;              // cứ 5 giây...
const TRAIN_EXP=2;              // ...được 1 EXP
const TRAIN_OFFLINE_MAX_H=4;    // tối đa bù bao nhiêu giờ khi tắt trang (0 = không giới hạn)

// tính số EXP đã tích lũy từ lần trước, cộng vào nhân vật. Trả về true nếu có thay đổi
function trainTick(){
  const now=Date.now();
  if(!S.trainAt)S.trainAt=now;                                 // lần đầu (hoặc sau khi chơi lại) thì bắt đầu đếm từ bây giờ
  let el=now-S.trainAt;                                        // thời gian đã trôi qua (ms)
  if(TRAIN_OFFLINE_MAX_H>0)el=Math.min(el,TRAIN_OFFLINE_MAX_H*3600000);
  const step=TRAIN_SEC*1000;
  const n=Math.floor(el/step);                                 // số lần "5 giây" đã đủ
  if(n<=0)return false;
  const lv0=S.lv;
  addExp(n*TRAIN_EXP);
  S.trainAt=now-(el%step);                                     // giữ lại phần dư chưa đủ 5 giây
  if(S.lv>lv0)say(`Tự luyện: lên cấp ${S.lv}!`);
  return true;
}

load();trainTick();render();   // thay cho: load();render();if(S.log[0])$('msg').textContent=S.log[0];
setInterval(()=>{if(tick())render()},1000); // qua mốc reset thì tự làm mới lượt và vẽ lại màn hình
setInterval(()=>{if(trainTick())render(1000000)},1000);  // đủ 5 giây thì cộng EXP và vẽ lại màn hình
</script>
